# ==============================================================================
# 金融智能客服业务流程定义配置文件 (user_flows.yml)
# ==============================================================================

slots:
  # ============================================================================
  # 1. 金融业务核心槽位
  # ============================================================================
  account_no:
    type: text
    label: 银行账户/卡号
    description: 客户的银行账户或银行卡号

  card_no:
    type: text
    label: 银行卡/信用卡号
    description: 需要办理挂失或查询的银行卡或信用卡卡号

  available_balance:
    type: text
    label: 可用余额
    description: 账户当前活期可用余额

  frozen_amount:
    type: text
    label: 冻结金额
    description: 账户当前被冻结金额

  currency:
    type: text
    label: 货币币种
    description: 账户币种代码（如 CNY）

  start_date:
    type: text
    label: 交易起始日期
    description: 查询交易明细的起始日期（格式：YYYY-MM-DD）

  end_date:
    type: text
    label: 交易截止日期
    description: 查询交易明细的截止日期（格式：YYYY-MM-DD）

  product_code:
    type: text
    label: 金融产品代码
    description: 申请的贷款产品代码或金融理财产品代码

  loan_amount:
    type: text
    label: 贷款金额
    description: 客户申请的消费贷款金额（元）

  loan_term:
    type: text
    label: 贷款期限
    description: 申请贷款的分期还款期数（月，支持 6、12、24、36 期）

  loan_purpose:
    type: text
    label: 贷款用途
    description: 贷款资金使用用途（如日常消费、装修、购车等）

  application_no:
    type: text
    label: 贷款申请编号
    description: 中台审批返回的贷款进件申请唯一编号

  loss_reason:
    type: text
    label: 挂失原因
    description: 信用卡或银行卡办理挂失的原因（如卡片丢失、被盗、疑似盗刷等）

  ticket_category:
    type: text
    label: 工单类型
    description: 投诉工单类型（如服务态度、转账未到账、扣费异常、系统故障等）

  complaint_category:
    type: text
    label: 投诉分类
    description: 客户投诉的具体业务分类

  ticket_description:
    type: text
    label: 问题描述
    description: 投诉或咨询问题的详细文字描述

  complaint_description:
    type: text
    label: 投诉描述
    description: 客户反馈的投诉详细事实与诉求说明

  ticket_no:
    type: text
    label: 工单编号
    description: 客服支持系统创建生成的工单编号

  related_no:
    type: text
    label: 关联业务/交易单号
    description: 投诉问题关联的交易流水号、卡号或贷款申请号

  contract_no:
    type: text
    label: 贷款合同号
    description: 贷款合同编号（例如 LCT 开头的合同号）

  bill_no:
    type: text
    label: 还款账单号
    description: 待还款账单编号（例如 BIL 或 BILL 开头的账单号）

  repayment_amount:
    type: text
    label: 还款金额
    description: 本次计划偿还的贷款金额（元）

  reply:
    type: text
    label: 动作答复文本
    description: Action 执行完成后返回给用户的格式化回复内容

  # ============================================================================
  # 2. 兼容保留槽位（供过渡期与回归测试使用）
  # ============================================================================
  order_number:
    type: text
    label: 订单号
    description: 兼容保留的订单号

  order_status:
    type: text
    label: 订单状态
    description: 兼容保留的订单状态

  order_summary:
    type: text
    label: 订单摘要
    description: 兼容保留的订单摘要信息

  tracking_number:
    type: text
    label: 物流单号
    description: 兼容保留的物流单号

  logistics_company:
    type: text
    label: 物流公司
    description: 兼容保留的物流公司名称

  logistics_status:
    type: text
    label: 物流进度
    description: 兼容保留的物流进度

  refund_reason:
    type: text
    label: 退款原因
    description: 兼容保留的退款原因

flows:
  # ============================================================================
  # 1. 基础引导与人工客服
  # ============================================================================
  onboarding:
    name: 欢迎引导
    description: 在聊天窗口初次打开时欢迎用户，并介绍助手可处理的金融银行服务。通常由系统主动触发。
    steps:
      - id: start
        type: start
        next: respond

      - id: respond
        type: response
        template:
          text: "您好，我是您的金融智能客服助手。我可以为您提供账户余额与交易明细查询、授信额度查询、消费贷款申请与审批进度查询、还款账单与逾期查询、贷款还款、信用卡紧急挂失及客服工单登记与进度查询等全链路金融服务。"
        next: end

      - id: end
        type: end
        next: []

  human_handoff:
    name: 人工客服
    description: 将当前对话转交给人工客服专员处理，并自动登记人工跟进工单。
    steps:
      - id: start
        type: start
        next: submit_handoff

      - id: submit_handoff
        type: action
        action: action_create_complaint_ticket
        next: respond

      - id: respond
        type: response
        template:
          text: "{{ slots.reply or '好的，已为您转接银行人工客服专员，请稍候。' }}"
        next: end

      - id: end
        type: end
        next: []

  # ============================================================================
  # 2. 五大金融任务型业务流程
  # ============================================================================
  account_balance_query:
    name: 账户余额查询
    description: 帮用户查询指定银行账户或银行卡的可用余额、冻结金额及状态。
    steps:
      - id: start
        type: start
        next: ask_account_no

      - id: ask_account_no
        type: collect
        slot_name: account_no
        template:
          text: "请提供您需要查询余额的银行卡号或账户号。"
        next: lookup_balance

      - id: lookup_balance
        type: action
        action: action_query_account_balance
        next: show_balance

      - id: show_balance
        type: response
        template:
          text: "{{ slots.reply or '已为您完成余额查询。' }}"
        next: end

      - id: end
        type: end
        next: []

  transaction_history_query:
    name: 交易明细查询
    description: 帮用户查询指定账户的历史交易流水明细。
    steps:
      - id: start
        type: start
        next: ask_account_no

      - id: ask_account_no
        type: collect
        slot_name: account_no
        template:
          text: "请提供您需要查询交易明细的银行卡号或账户号。"
        next: lookup_transactions

      - id: lookup_transactions
        type: action
        action: action_query_transactions
        next: show_transactions

      - id: show_transactions
        type: response
        template:
          text: "{{ slots.reply or '已为您查询交易记录。' }}"
        next: end

      - id: end
        type: end
        next: []

  loan_application:
    name: 贷款申请
    description: 引导用户提交消费贷款申请，收集贷款金额、期限等信息并提交中台审批。
    steps:
      - id: start
        type: start
        next: ask_amount

      - id: ask_amount
        type: collect
        slot_name: loan_amount
        template:
          text: "请问您本次计划申请的贷款金额是多少元？"
        quick_replies:
          - label: "1 万元"
            value: "10000"
          - label: "5 万元"
            value: "50000"
          - label: "10 万元"
            value: "100000"
        next: ask_term

      - id: ask_term
        type: collect
        slot_name: loan_term
        template:
          text: "请问您期望的贷款期限是几个月？（支持 6、12、24、36 期）"
        quick_replies:
          - label: "6 期"
            value: "6期"
          - label: "12 期"
            value: "12期"
          - label: "24 期"
            value: "24期"
          - label: "36 期"
            value: "36期"
        next: confirm_loan

      - id: confirm_loan
        type: confirm
        risk_level: high
        confirm_slot: _confirmed
        template:
          text: "【操作确认】请核对您的贷款申请信息：申请金额 **{{ slots.loan_amount }} 元**，期限 **{{ slots.loan_term }} 个月**。确认提交后将冻结对应授信额度，是否确认办理？"
        cancel_message: "好的，已为您取消本次消费贷款申请，未冻结授信额度。"
        next: submit_loan

      - id: submit_loan
        type: action
        action: action_apply_loan
        next: show_loan_result

      - id: show_loan_result
        type: response
        template:
          text: "{{ slots.reply or '贷款申请已成功提交。' }}"
        next: end

      - id: end
        type: end
        next: []

  card_loss_report:
    name: 信用卡挂失
    description: 帮用户紧急挂失信用卡或银行卡，变更状态为挂失生效，防止资金损失。
    steps:
      - id: start
        type: start
        next: ask_card_no

      - id: ask_card_no
        type: collect
        slot_name: card_no
        template:
          text: "请提供需要紧急挂失的银行卡号或信用卡号。"
        next: ask_reason

      - id: ask_reason
        type: collect
        slot_name: loss_reason
        template:
          text: "请问挂失的主要原因是什么？（例如：卡片丢失、被盗、疑似被盗刷等）"
        quick_replies:
          - label: "卡片丢失"
            value: "卡片丢失"
          - label: "疑似盗刷"
            value: "疑似盗刷"
          - label: "卡片被盗"
            value: "卡片被盗"
        next: confirm_card_loss

      - id: confirm_card_loss
        type: confirm
        risk_level: high
        confirm_slot: _confirmed
        template:
          text: "【高风险操作确认】即将对卡片/账户 **{{ mask_id(slots.card_no) }}** 办理紧急挂失（挂失原因：{{ slots.loss_reason }}），确认后账户与关联银行卡将立即止付。是否确认继续办理？"
        cancel_message: "好的，已为您取消本次卡片挂失操作，账户与银行卡状态未作变更。"
        next: submit_loss

      - id: submit_loss
        type: action
        action: action_report_card_loss
        next: show_loss_result

      - id: show_loss_result
        type: response
        template:
          text: "{{ slots.reply or '卡片已成功办理紧急挂失，资金安全已受保护。' }}"
        next: end

      - id: end
        type: end
        next: []

  complaint_ticket:
    name: 投诉工单
    description: 收集客户遇到的问题并创建客服投诉处理工单。
    steps:
      - id: start
        type: start
        next: ask_category

      - id: ask_category
        type: collect
        slot_name: ticket_category
        template:
          text: "请问您要投诉或反馈的问题类型是什么？（如：服务态度、转账未到账、扣费异常、系统故障等）"
        quick_replies:
          - label: "转账未到账"
            value: "转账未到账"
          - label: "扣费异常"
            value: "扣费异常"
          - label: "服务态度"
            value: "服务态度"
          - label: "系统故障"
            value: "系统故障"
          - label: "产品与功能建议"
            value: "产品与功能建议"
        next: ask_desc

      - id: ask_desc
        type: collect
        slot_name: ticket_description
        template:
          text: "请详细描述您遇到的问题经过或诉求。"
        next: submit_ticket

      - id: submit_ticket
        type: action
        action: action_create_complaint_ticket
        next: show_ticket_result

      - id: show_ticket_result
        type: response
        template:
          text: "{{ slots.reply or '您的投诉工单已创建成功，我们将尽快处理。' }}"
        next: end

      - id: end
        type: end
        next: []

  loan_progress_query:
    name: 贷款进度查询
    description: 帮用户根据贷款申请编号查询消费或经营贷款的当前审批进度及合同信息。
    steps:
      - id: start
        type: start
        next: ask_application_no

      - id: ask_application_no
        type: collect
        slot_name: application_no
        template:
          text: "请提供您需要查询进度的贷款申请编号（例如 LAP 开头的编号）。"
        next: query_loan_progress

      - id: query_loan_progress
        type: action
        action: action_query_loan_progress
        next: show_loan_progress

      - id: show_loan_progress
        type: response
        template:
          text: "{{ slots.reply or '已为您完成贷款进度查询。' }}"
        next: end

      - id: end
        type: end
        next: []

  ticket_query:
    name: 工单进度查询
    description: 帮用户根据客服工单编号查询投诉建议工单的当前处理进度及专席反馈。
    steps:
      - id: start
        type: start
        next: ask_ticket_no

      - id: ask_ticket_no
        type: collect
        slot_name: ticket_no
        template:
          text: "请提供您需要查询进度的工单编号（例如 TKT 或 TCK 开头的编号）。"
        next: query_ticket

      - id: query_ticket
        type: action
        action: action_query_complaint_ticket
        next: show_ticket_progress

      - id: show_ticket_progress
        type: response
        template:
          text: "{{ slots.reply or '已为您完成工单进度查询。' }}"
        next: end

      - id: end
        type: end
        next: []

  credit_limit_query:
    name: 授信额度查询
    description: 帮用户查询名下各信贷产品的可用授信额度、总额度、已冻结额度及有效期。
    steps:
      - id: start
        type: start
        next: query_limits

      - id: query_limits
        type: action
        action: action_query_credit_limit
        next: show_limits

      - id: show_limits
        type: response
        template:
          text: "{{ slots.reply or '已完成授信额度查询。' }}"
        next: end

      - id: end
        type: end
        next: []

  repayment_plan_query:
    name: 还款计划与账单查询
    description: 帮用户查询名下贷款还款账单、还款计划明细及逾期情况（支持直接查询客户名下账单或指定合同号）。
    steps:
      - id: start
        type: start
        next: query_repayment_plan

      - id: query_repayment_plan
        type: action
        action: action_query_repayment_plan
        next: show_repayment_plan

      - id: show_repayment_plan
        type: response
        template:
          text: "{{ slots.reply or '已完成还款账单与计划查询。' }}"
        next: end

      - id: end
        type: end
        next: []

  loan_repayment:
    name: 贷款还款
    description: 引导用户对指定贷款还款账单发起正常还款，收集账单号、扣款账户及还款金额并经二次确认后扣款入账。
    steps:
      - id: start
        type: start
        next: ask_bill_no

      - id: ask_bill_no
        type: collect
        slot_name: bill_no
        template:
          text: "请提供需要还款的账单编号（例如 BILL 开头的编号，或先让我为您查询待还账单）。"
        next: ask_account_no

      - id: ask_account_no
        type: collect
        slot_name: account_no
        template:
          text: "请提供用于扣款还款的银行卡号或账户号（支持 4 位尾号）。"
        next: ask_repayment_amount

      - id: ask_repayment_amount
        type: collect
        slot_name: repayment_amount
        template:
          text: "请问本次计划还款多少元？"
        next: confirm_repayment

      - id: confirm_repayment
        type: confirm
        risk_level: high
        confirm_slot: _confirmed
        template:
          text: "【高风险资金操作确认】即将从账户 **{{ mask_id(slots.account_no) }}** 扣款 **{{ slots.repayment_amount }} 元** 偿还账单 **{{ slots.bill_no }}**。是否确认提交还款？"
        cancel_message: "好的，已为您取消本次贷款还款操作，账户资金未发生变动。"
        next: submit_repayment

      - id: submit_repayment
        type: action
        action: action_submit_repayment
        next: show_repayment_result

      - id: show_repayment_result
        type: response
        template:
          text: "{{ slots.reply or '您的贷款还款已完成。' }}"
        next: end

      - id: end
        type: end
        next: []

  # ============================================================================
  # 3. 兼容保留流程（供过渡期回归测试使用）
  # ============================================================================
  order_status_query:
    name: 订单状态查询（兼容保留）
    description: 兼容保留的订单状态查询流程。
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        template:
          text: "请告诉我你的订单号。"
        next: lookup_order_status

      - id: lookup_order_status
        type: action
        action: action_lookup_order_status
        next: show_order_status

      - id: show_order_status
        type: response
        template:
          text: "订单{{ slots.order_number }} 当前状态是：{{ slots.order_status }}。{{ slots.order_summary }}"
        next: end

      - id: end
        type: end
        next: []

  logistics_tracking:
    name: 物流查询（兼容保留）
    description: 兼容保留的物流进度查询流程。
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        template:
          text: "请告诉我你的订单号。"
        next: lookup_logistics

      - id: lookup_logistics
        type: action
        action: action_lookup_logistics
        next: show_logistics

      - id: show_logistics
        type: response
        template:
          text: "订单{{ slots.order_number }} 由{{ slots.logistics_company }}配送，物流单号是{{ slots.tracking_number }}。当前进度：{{ slots.logistics_status }}。"
        next: end

      - id: end
        type: end
        next: []

  refund_request:
    name: 退款申请（兼容保留）
    description: 兼容保留的退款申请流程。
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        template:
          text: "请告诉我你的订单号。"
        next: ask_refund_reason

      - id: ask_refund_reason
        type: collect
        slot_name: refund_reason
        template:
          text: "请简单说一下退款原因。"
        next: refund_submitted

      - id: refund_submitted
        type: response
        template:
          text: "好的，订单{{ slots.order_number }}的退款申请已提交，原因是：{{ slots.refund_reason }}。后续会尽快为你处理。"
        next: end

      - id: end
        type: end
        next: []
